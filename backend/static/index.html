<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AIと話そう！</title>
  <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #667eea;
            --primary-dark: #764ba2;
            --bg-light: white;
            --text-light: #333;
            --msg-user-bg: #667eea;
            --msg-user-text: white;
            --msg-ai-bg: #f1f3f5;
            --msg-ai-text: #333;
            --border-color: #eee;
            --input-bg: #f5f5f5;
            --input-focus-bg: #fafafa;
            --timestamp-color: #999;
        }

        body.dark-mode {
            --bg-light: #1a1a1a;
            --text-light: #e0e0e0;
            --msg-ai-bg: #2d2d2d;
            --msg-ai-text: #e0e0e0;
            --border-color: #333;
            --input-bg: #2d2d2d;
            --input-focus-bg: #333;
            --timestamp-color: #888;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 10px;
            padding-top: 20px;
            color: var(--text-light);
            transition: background-color 0.3s;
        }

        body.dark-mode {
            background: linear-gradient(135deg, #1a1a1a 0%, #0d0d0d 100%);
        }

        .container {
            background: var(--bg-light);
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            height: 90vh;
            max-height: 700px;
            overflow: hidden;
            transition: background-color 0.3s;
        }

        .header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 12px 12px 0 0;
            flex-shrink: 0;
        }

        .header-title {
            flex: 1;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .header p {
            font-size: 11px;
            opacity: 0.9;
        }

        .header-controls {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 16px;
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: var(--bg-light);
        }

        .message {
            display: flex;
            flex-direction: column;
            margin-bottom: 8px;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            align-items: flex-end;
        }

        .message.assistant {
            align-items: flex-start;
        }

        .message-content {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 18px;
            word-wrap: break-word;
            font-size: 15px;
            line-height: 1.4;
            position: relative;
        }

        .message.user .message-content {
            background: var(--msg-user-bg);
            color: var(--msg-user-text);
            border-bottom-right-radius: 4px;
        }

        .message.assistant .message-content {
            background: var(--msg-ai-bg);
            color: var(--msg-ai-text);
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .message-actions {
            display: flex;
            gap: 8px;
            margin-top: 6px;
            font-size: 12px;
        }

        .message.assistant .message-actions {
            margin-left: 12px;
        }

        .msg-action-btn {
            background: rgba(102, 126, 234, 0.1);
            color: var(--primary);
            border: none;
            padding: 4px 10px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.2s;
        }

        .msg-action-btn:hover {
            background: rgba(102, 126, 234, 0.2);
        }

        .timestamp {
            font-size: 11px;
            color: var(--timestamp-color);
            margin-top: 4px;
            padding: 0 8px;
        }

        .message.assistant .timestamp {
            text-align: left;
        }

        .message.user .timestamp {
            text-align: right;
        }

        .feedback-box {
            background: rgba(255, 193, 7, 0.1);
            border-left: 3px solid #ffc107;
            padding: 8px 12px;
            margin-top: 8px;
            border-radius: 4px;
            font-size: 13px;
            color: var(--text-light);
        }

        .loading {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 12px 16px;
            background: var(--msg-ai-bg);
            border-radius: 18px;
            width: fit-content;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--primary);
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                opacity: 0.3;
                transform: translateY(0);
            }
            30% {
                opacity: 1;
                transform: translateY(-10px);
            }
        }

        .input-status {
            font-size: 11px;
            color: var(--timestamp-color);
            margin-top: 4px;
            padding: 0 8px;
            min-height: 16px;
        }

        .input-area {
            border-top: 1px solid var(--border-color);
            padding: 12px 15px;
            background: var(--bg-light);
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-row {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .input-container {
            flex: 1;
            display: flex;
            align-items: center;
            background: var(--input-bg);
            border-radius: 24px;
            padding: 10px 16px;
            border: 2px solid transparent;
            transition: border-color 0.3s;
        }

        .input-container:focus-within {
            border-color: var(--primary);
            background: var(--input-focus-bg);
        }

        .input-container input {
            flex: 1;
            border: none;
            background: transparent;
            outline: none;
            font-size: 15px;
            font-family: inherit;
            color: var(--text-light);
        }

        .input-container input::placeholder {
            color: var(--timestamp-color);
        }

        .send-btn, .reset-btn, .icon-btn {
            -webkit-user-select: none;
            user-select: none;
        }

        .send-btn {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            flex-shrink: 0;
            font-size: 18px;
        }

        .send-btn:hover:not(:disabled) {
            background: var(--primary-dark);
            transform: scale(1.05);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .reset-btn {
            background: var(--input-bg);
            color: var(--text-light);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            flex-shrink: 0;
            font-size: 14px;
        }

        .reset-btn:hover {
            background: var(--border-color);
            border-color: var(--text-light);
        }

        .welcome-message {
            text-align: center;
            padding: 40px 20px;
            color: var(--timestamp-color);
        }

        .welcome-message h2 {
            font-size: 20px;
            margin-bottom: 10px;
            color: var(--primary);
        }

        .welcome-message p {
            font-size: 14px;
            line-height: 1.6;
        }

        /* Mobile optimization */
        @media (max-width: 480px) {
            .container {
                border-radius: 0;
                height: 100vh;
                max-height: none;
            }

            .header {
                border-radius: 0;
            }

            .header h1 {
                font-size: 20px;
            }

            .chat-area {
                padding: 15px;
                gap: 8px;
            }

            .message-content {
                font-size: 14px;
            }

            .input-area {
                padding: 12px;
            }
        }

        /* Scrollbar styling */
        .chat-area::-webkit-scrollbar {
            width: 6px;
        }

        .chat-area::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-area::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }

        .chat-area::-webkit-scrollbar-thumb:hover {
            background: var(--timestamp-color);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-title">
                <h1>💬 AIと話そう！</h1>
                <p>Practice naturally</p>
            </div>
            <div class="header-controls">
                <button class="icon-btn" id="darkModeBtn" title="Dark mode">🌙</button>
                <button class="icon-btn" id="translateBtn" title="Translate" style="display:none;">🌐</button>
                <button class="icon-btn" id="explainBtn" title="Explain" style="display:none;">❓</button>
            </div>
        </div>

        <div class="chat-area" id="chatArea" role="log" aria-live="polite">
            <div class="welcome-message">
                <h2>Welcome! 👋</h2>
                <p>Start typing to practice English. I'll help you naturally!</p>
            </div>
        </div>

        <div class="input-area">
            <div class="input-status" id="inputStatus" aria-live="polite"></div>
            <div class="explain-output" id="explainOutput" aria-live="polite" style="display:none; padding:8px 12px; border-top:1px solid var(--border-color);"></div>
            <div class="input-row">
                <button class="reset-btn" id="resetBtn" title="Reset conversation">🔄</button>
                <div class="input-container">
                    <input 
                        type="text" 
                        id="messageInput" 
                        placeholder="Type your message..."
                        autocomplete="off"
                        aria-label="Message input"
                    >
                </div>
                <button class="send-btn" id="sendBtn" disabled>➤</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // CONFIGURATION
        // ============================================================
        const API_BASE_URL = window.location.origin;
        const CHAT_ENDPOINT = `${API_BASE_URL}/chat`;
        const TRANSLATE_ENDPOINT = `${API_BASE_URL}/translate`;

        // ============================================================
        // STATE MANAGEMENT
        // ============================================================
        let sessionId = null;
        let isLoading = false;
        let messageCount = 0;
        let darkMode = localStorage.getItem('darkMode') === 'true';
        let selectedText = '';
        let retryCount = 0;
        const MAX_RETRIES = 3;

        // ============================================================
        // DOM ELEMENTS
        // ============================================================
        const chatArea = document.getElementById('chatArea');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const resetBtn = document.getElementById('resetBtn');
        const darkModeBtn = document.getElementById('darkModeBtn');
        const translateBtn = document.getElementById('translateBtn');
        const explainBtn = document.getElementById('explainBtn');
        const inputStatus = document.getElementById('inputStatus');
        const explainOutput = document.getElementById('explainOutput');

        // ============================================================
        // INITIALIZATION
        // ============================================================
        document.addEventListener('DOMContentLoaded', () => {
            console.log('✓ AIと話そう！ loaded');
            initializeSession();
            initializeDarkMode();
            attachEventListeners();
            messageInput.focus();
        });

        // ============================================================
        // EVENT LISTENERS
        // ============================================================
        function attachEventListeners() {
            sendBtn.addEventListener('click', sendMessage);
            messageInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey && !isLoading) {
                    e.preventDefault();
                    sendMessage();
                }
            });
            messageInput.addEventListener('input', handleInputChange);
            resetBtn.addEventListener('click', resetConversation);
            darkModeBtn.addEventListener('click', toggleDarkMode);
            translateBtn.addEventListener('click', translateSelectedText);
            explainBtn.addEventListener('click', showExplanationForSelection);
            document.addEventListener('mouseup', updateSelectedText);
        }

        // ============================================================
        // DARK MODE
        // ============================================================
        function initializeDarkMode() {
            if (darkMode) {
                document.body.classList.add('dark-mode');
                darkModeBtn.textContent = '☀️';
                darkModeBtn.setAttribute('aria-pressed', 'true');
            }
            darkModeBtn.setAttribute('aria-label', 'Toggle dark mode');
            translateBtn.setAttribute('aria-label', 'Translate selected text');
            explainBtn.setAttribute('aria-label', 'Show explanation for grammar mistakes');
            resetBtn.setAttribute('aria-label', 'Reset conversation');
            sendBtn.setAttribute('aria-label', 'Send message');
        }

        function toggleDarkMode() {
            darkMode = !darkMode;
            localStorage.setItem('darkMode', darkMode);
            document.body.classList.toggle('dark-mode');
            darkModeBtn.textContent = darkMode ? '☀️' : '🌙';
            darkModeBtn.setAttribute('aria-pressed', darkMode ? 'true' : 'false');
        }

        // ============================================================
        // SESSION MANAGEMENT
        // ============================================================
        function initializeSession() {
            sessionId = localStorage.getItem('sessionId') || generateSessionId();
            localStorage.setItem('sessionId', sessionId);
            console.log(`✓ Session: ${sessionId.substring(0, 8)}...`);
        }

        function generateSessionId() {
            return 'sess_' + Date.now() + '_' + Math.random().toString(36).substring(7);
        }

        // ============================================================
        // INPUT HANDLING
        // ============================================================
        function handleInputChange() {
            updateSendButtonState();
            
            const text = messageInput.value.trim();
            if (!text) {
                inputStatus.textContent = '';
                return;
            }

            if (text.length < 10) {
                inputStatus.textContent = '💡 Try adding more detail so I can respond naturally.';
            } else if (text.length < 40) {
                inputStatus.textContent = `💬 ${text.length} chars — good start!`;
            } else if (text.length < 120) {
                inputStatus.textContent = `💬 ${text.length} chars — great detail.`;
            } else if (text.length < 250) {
                inputStatus.textContent = `💬 ${text.length} chars — keep it clear and simple.`;
            } else {
                inputStatus.textContent = '⚠️ Too long. Try a shorter sentence for faster response.';
            }
            checkGrammarDebounced();
        }

        function updateSendButtonState() {
            const hasText = messageInput.value.trim().length > 0;
            sendBtn.disabled = !hasText || isLoading;
        }

        // ============================================================
        // TRANSLATION
        // ============================================================

        function updateSelectedText() {
            selectedText = window.getSelection().toString();
            if (selectedText.length > 0) {
                translateBtn.style.display = 'block';
                // Check grammar for the selected text to decide whether to show explain
                (async () => {
                    try {
                        const resp = await fetch(`${API_BASE_URL}/grammar_check`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ text: selectedText })
                        });
                        if (resp.ok) {
                            const data = await resp.json();
                            const hasTip = data && data.tips && data.tips.length > 0;
                            explainBtn.style.display = hasTip ? 'inline-block' : 'none';
                        }
                    } catch (e) {
                        // ignore errors
                    }
                })();
            } else {
                translateBtn.style.display = 'none';
                explainBtn.style.display = 'none';
            }
        }

        // Debounce helper
        function debounce(fn, delay) {
            let t = null;
            return function(...args) {
                clearTimeout(t);
                t = setTimeout(() => fn.apply(this, args), delay);
            };
        }

        // Check grammar lightly on input and toggle explain button
        const checkGrammarDebounced = debounce(async () => {
            const text = messageInput.value.trim();
            if (!text) {
                translateBtn.style.display = 'none';
                explainBtn.style.display = 'none';
                explainOutput.style.display = 'none';
                return;
            }

            try {
                const resp = await fetch(`${API_BASE_URL}/grammar_check`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });
                if (resp.ok) {
                    const data = await resp.json();
                    const hasTip = data && data.tips && data.tips.length > 0;
                    translateBtn.style.display = 'inline-block';
                    explainBtn.style.display = hasTip ? 'inline-block' : 'none';
                    if (!hasTip) explainOutput.style.display = 'none';
                }
            } catch (e) {
                // ignore
            }
        }, 700);

        async function translateSelectedText() {
            if (!selectedText) return;

            try {
                const response = await fetch(TRANSLATE_ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: selectedText })
                });

                if (response.ok) {
                    const data = await response.json();
                    alert(`🌐 Translation:\n\n${selectedText}\n↓\n${data.translation}`);
                } else {
                    alert('翻訳に失敗しました');
                }
            } catch (error) {
                console.error('Translation error:', error);
                alert('翻訳サービスに接続できません');
            }
        }

    async function showExplanationForSelection() {
        const text = selectedText && selectedText.length > 0 ? selectedText : messageInput.value.trim();
        if (!text) return;

        explainOutput.textContent = 'Loading explanation...';
        explainOutput.style.display = 'block';

        try {
            const resp = await fetch(`${API_BASE_URL}/explain`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text })
            });
            if (resp.ok) {
                const data = await resp.json();
                if (data && data.explanations && data.explanations.length > 0) {
                    // After showing explanations, also fetch structured suggestions
                    explainOutput.innerHTML = '';
                    data.explanations.forEach((ex, idx) => {
                        const p = document.createElement('div');
                        p.style.marginBottom = '8px';
                        p.textContent = ex;
                        explainOutput.appendChild(p);
                    });

                    // fetch suggestions
                    try {
                        const sresp = await fetch(`${API_BASE_URL}/suggest`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ text })
                        });
                        if (sresp.ok) {
                            const sdata = await sresp.json();
                            if (sdata && sdata.suggestions && sdata.suggestions.length > 0) {
                                const list = document.createElement('div');
                                list.style.marginTop = '6px';
                                sdata.suggestions.forEach((s, i) => {
                                    const item = document.createElement('div');
                                    item.style.borderTop = '1px solid var(--border-color)';
                                    item.style.paddingTop = '6px';
                                    const info = document.createElement('div');
                                    info.textContent = `${s.hint || ''}`;
                                    const orig = document.createElement('div');
                                    orig.style.marginTop = '4px';
                                    orig.style.fontFamily = 'monospace';
                                    orig.textContent = `→ ${s.original || '(detected)'}  → ${s.replacement || '(suggestion)'}`;
                                    const btn = document.createElement('button');
                                    btn.textContent = 'Apply';
                                    btn.style.marginLeft = '8px';
                                    btn.onclick = () => applySuggestion(s);
                                    item.appendChild(info);
                                    item.appendChild(orig);
                                    item.appendChild(btn);
                                    list.appendChild(item);
                                });
                                explainOutput.appendChild(list);
                            }
                        }
                    } catch (e) {
                        // ignore
                    }
                } else {
                    explainOutput.textContent = 'No issues detected.';
                }
            } else {
                explainOutput.textContent = 'Could not fetch explanation.';
            }
        } catch (e) {
            explainOutput.textContent = 'Error while fetching explanation.';
        }
    }

    function applySuggestion(s) {
        // Try to apply replacement into the message input: replace first occurrence of original
        const original = s.original || '';
        const replacement = s.replacement || '';
        if (!original && !replacement) return;

        let value = messageInput.value;
        if (original && value.includes(original)) {
            messageInput.value = value.replace(original, replacement);
        } else if (original && selectedText && selectedText.length > 0 && value.includes(selectedText)) {
            // if selection inside input
            messageInput.value = value.replace(selectedText, replacement);
        } else {
            // fallback: replace first word-like occurrence
            messageInput.value = replacement + (value ? (' ' + value) : '');
        }

        // Rerun checks and focus
        checkGrammarDebounced();
        messageInput.focus();
    }

        // ============================================================
        // MESSAGE SENDING
        // ============================================================
        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text || isLoading) return;

            isLoading = true;
            retryCount = 0;
            updateSendButtonState();

            if (messageCount === 0) {
                const welcomeMessage = chatArea.querySelector('.welcome-message');
                if (welcomeMessage) welcomeMessage.remove();
            }

            addMessage('user', text);
            messageInput.value = '';
            messageCount++;
            inputStatus.textContent = '';

            const loadingId = 'loading-' + Date.now();
            const loadingElement = createLoadingElement(loadingId);
            chatArea.appendChild(loadingElement);
            scrollToBottom();

            try {
                    const response = await fetchWithRetry(
                    CHAT_ENDPOINT,
                    {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ text, session_id: sessionId })
                    }
                );

                if (!response.ok) {
                    const body = await response.text();
                    throw new Error(`Server error ${response.status}: ${body}`);
                }

                const data = await response.json();
                
                if (loadingElement.parentNode) loadingElement.remove();

                if (data.response) {
                    addMessage('assistant', data.response, data.feedback);
                    if (data.session_id) {
                        sessionId = data.session_id;
                        localStorage.setItem('sessionId', sessionId);
                    }
                } else {
                    addMessage('assistant', '❌ Sorry, something went wrong. Please try again.');
                }
            } catch (error) {
                console.error('Send error:', error);
                if (loadingElement.parentNode) loadingElement.remove();
                addMessage('assistant', '❌ Connection error. Retrying...');
            } finally {
                isLoading = false;
                updateSendButtonState();
                messageInput.focus();
            }
        }

        // ============================================================
        // ERROR HANDLING & RETRY LOGIC
        // ============================================================
        async function fetchWithRetry(url, options, attempt = 0) {
            try {
                const response = await Promise.race([
                    fetch(url, options),
                    new Promise((_, reject) =>
                        setTimeout(() => reject(new Error('Timeout')), 5000)
                    )
                ]);

                if (!response.ok) {
                    if (response.status >= 500 && attempt < MAX_RETRIES) {
                        console.warn(`Retry ${attempt + 1}/${MAX_RETRIES}`);
                        await new Promise(resolve => setTimeout(resolve, 500 * (attempt + 1)));
                        return fetchWithRetry(url, options, attempt + 1);
                    }
                    return response;
                }
                return response;
            } catch (error) {
                if (attempt < MAX_RETRIES && error.message === 'Timeout') {
                    console.warn(`Retry ${attempt + 1}/${MAX_RETRIES} after timeout`);
                    await new Promise(resolve => setTimeout(resolve, 500 * (attempt + 1)));
                    return fetchWithRetry(url, options, attempt + 1);
                }
                throw error;
            }
        }

        // ============================================================
        // UI HELPERS
        // ============================================================
        function createLoadingElement(id) {
            const div = document.createElement('div');
            div.id = id;
            div.className = 'message assistant';
            div.innerHTML = `<div class="loading">
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
            </div>`;
            return div;
        }

        function addMessage(role, content, feedback = null) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;

            const timestamp = new Date().toLocaleTimeString('en-US', {
                hour: '2-digit',
                minute: '2-digit'
            });

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.textContent = content;

            const timestampDiv = document.createElement('div');
            timestampDiv.className = 'timestamp';
            timestampDiv.textContent = timestamp;

            messageDiv.appendChild(contentDiv);

            // Add translation and feedback for assistant messages
            if (role === 'assistant') {
                const actionsDiv = document.createElement('div');
                actionsDiv.className = 'message-actions';
                actionsDiv.innerHTML = `
                    <button class="msg-action-btn" onclick="copyToClipboard(this.closest('.message').querySelector('.message-content').textContent)">📋 Copy</button>
                    <button class="msg-action-btn" onclick="translateMessage(this.closest('.message').querySelector('.message-content').textContent)">🌐 Translate</button>
                `;
                messageDiv.appendChild(actionsDiv);

                if (feedback) {
                    const feedbackDiv = document.createElement('div');
                    feedbackDiv.className = 'feedback-box';
                    feedbackDiv.textContent = `💡 ${feedback}`;
                    messageDiv.appendChild(feedbackDiv);
                }
            }

            messageDiv.appendChild(timestampDiv);
            chatArea.appendChild(messageDiv);
            scrollToBottom();
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert('✓ Copied to clipboard!');
            }).catch(() => {
                alert('Copy failed. Please try again.');
            });
        }

        async function translateMessage(text) {
            if (!text) return;
            try {
                const response = await fetch(TRANSLATE_ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });

                if (!response.ok) {
                    alert('Translation failed.');
                    return;
                }

                const data = await response.json();
                alert(`🌐 Translation:\n\n${text}\n↓\n${data.translation}`);
            } catch (error) {
                console.error('Translation error:', error);
                alert('Translation service unavailable.');
            }
        }

        function scrollToBottom() {
            setTimeout(() => {
                chatArea.scrollTop = chatArea.scrollHeight;
            }, 0);
        }

        // ============================================================
        // RESET
        // ============================================================
        async function resetConversation() {
            if (!confirm('🔄 Reset conversation?')) return;

            try {
                await fetch(`${API_BASE_URL}/reset`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id: sessionId })
                });

                chatArea.innerHTML = `
                    <div class="welcome-message">
                        <h2>Welcome! 👋</h2>
                        <p>Start typing to practice English. I'll help you naturally!</p>
                    </div>
                `;

                sessionId = generateSessionId();
                localStorage.setItem('sessionId', sessionId);
                messageCount = 0;
                messageInput.value = '';
                inputStatus.textContent = '';
                updateSendButtonState();
                messageInput.focus();

                console.log('✓ Conversation reset');
            } catch (error) {
                console.error('Reset error:', error);
            }
        }

        console.log('=== AIと話そう！ v3.1 ===');
        console.log('Features: Dark Mode, Translation, Error Retry, Grammar Feedback');
    </script>
</body>
</html>
